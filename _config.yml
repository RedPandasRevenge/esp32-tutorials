# _config.yml — Configurazione Jekyll per GitHub Pages

title: "Tutorial ESP32 & M5Stack"
description: "Guide pratiche per studenti su M5Stack, M5Stamp, Arduino e ESP32"
author: "RedPandasRevenge"

remote_theme: pages-themes/hacker@v0.2.0
plugins:
  - jekyll-remote-theme

# Impostazioni Markdown
markdown: kramdown
highlighter: rouge   # evidenziazione sintassi del codice

collections:
  tutorial:
    output: true
    permalink: /tutorial/:name

defaults:
  - scope:
      path: ""
      type: tutorial
    values:
      layout: default

# Esclusione file non necessari
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
